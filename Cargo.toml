[package]
name = "shuati-webui-rust"
version = "0.1.0"
edition = "2021"
description = "国考刷题网页（行测/申论/计算机岗）— tiny_http 单二进制，服务端判分"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
